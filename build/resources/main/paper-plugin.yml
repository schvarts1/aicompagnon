main: git.schvarts11.aicompagnon.AicompagnonMod
name: ai-compagnon
version: 1.0.0
authors: [MCreator]
bootstrapper: git.schvarts11.aicompagnon.AicompagnonModBootstrap
website: https://mcreator.net
api-version: 26.1

commands:
  compagnon:
    description: Manage AI companions
    usage: /<command> <subcommand> [args]
    permission: aicompagnon.spawn
    permission-message: §cYou do not have permission.
    aliases: [ac]

permissions:
  aicompagnon.spawn:
    description: Allows spawning and listing companions
    default: op
    children:
      aicompagnon.admin: false
  aicompagnon.admin:
    description: Allows removing companions and reloading config
    default: op
